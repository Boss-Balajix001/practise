```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Form</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f2f2f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-box {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

    </style>

</head>


<body>

    <div class="form-box">

        <h2 class="text-center mb-4">
            Send Message
        </h2>


        <form
            action="https://script.google.com/macros/s/AKfycbxXVOeqNn94fZGiE6iVXWkoWhAql8RJHwlKJh4bLQae2l9_-XTm-siP9hS3tTrXFuE/exec"
            method="POST"
            target="hidden_iframe"
            id="messageForm"
        >

            <!-- Name -->

            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- Message -->

            <div class="mb-3">

                <label class="form-label">
                    Message
                </label>

                <textarea
                    name="message"
                    class="form-control"
                    rows="5"
                    placeholder="Enter your message"
                    required
                ></textarea>

            </div>


            <!-- Button -->

            <button
                type="submit"
                class="btn btn-primary w-100"
                id="submitButton"
            >
                Submit
            </button>


            <!-- Success message -->

            <div
                id="successMessage"
                class="alert alert-success mt-3"
                style="display:none;"
            >
                Message submitted successfully!
            </div>

        </form>

    </div>


    <!-- Hidden iframe -->

    <iframe
        name="hidden_iframe"
        id="hidden_iframe"
        style="display:none;"
    ></iframe>


    <script>

        const form = document.getElementById("messageForm");

        const button = document.getElementById("submitButton");

        const successMessage =
            document.getElementById("successMessage");

        const iframe =
            document.getElementById("hidden_iframe");


        form.addEventListener("submit", function() {

            button.disabled = true;

            button.innerText = "Submitting...";

        });


        iframe.addEventListener("load", function() {

            if (button.disabled) {

                successMessage.style.display = "block";

                button.disabled = false;

                button.innerText = "Submit";

                form.reset();

            }

        });

    </script>

</body>

</html>
```
